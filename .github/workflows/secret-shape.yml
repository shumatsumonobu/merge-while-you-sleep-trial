# CLAUDE_CODE_OAUTH_TOKEN の形だけを確かめる（値は出さない）。確かめたら消す
name: secret-shape

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "長さ ${#T}"
          case "$T" in sk-ant-oat01-*) echo "頭 sk-ant-oat01- に合う";; *) echo "頭 sk-ant-oat01- に合わない";; esac
          echo "空白か改行の数 $(printf '%s' "$T" | tr -cd ' \t\r\n' | wc -c)"
          echo "英数字と - _ 以外の文字の数 $(printf '%s' "$T" | tr -d 'A-Za-z0-9_-' | wc -c)"
