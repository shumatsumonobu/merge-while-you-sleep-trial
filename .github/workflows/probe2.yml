# App のトークンで確かめる（試験用のリポジトリだけ。試験が終わったら消す）
name: probe2
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [mhc, ub-create, ub-update]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node .github/probe/probe2.mjs
        env:
          MODE: ${{ inputs.mode }}
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
