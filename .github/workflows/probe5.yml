# ゲートを隔離したときの時間を測る（試験用のリポジトリだけ。試験が終わったら消す）
name: probe5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node .github/probe/probe5.mjs
